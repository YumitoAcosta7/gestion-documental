# Entrada HTTPS de Gestión Documental. instalar.sh reemplaza NOMBRE_SERVIDOR.
server {
    listen 80;
    server_name NOMBRE_SERVIDOR;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name NOMBRE_SERVIDOR;

    ssl_certificate     /etc/gestion-documental/tls/certificado.crt;
    ssl_certificate_key /etc/gestion-documental/tls/certificado.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:gestion_documental:10m;

    # Un poco más que el límite de la aplicación (spring.servlet.multipart.max-request-size), para que
    # el mensaje claro de archivo demasiado grande lo dé la aplicación
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Reemplaza lo que mande el navegador: la IP de las bitácoras no se puede falsificar con esta cabecera
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 120s;
    }
}

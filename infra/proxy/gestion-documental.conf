# =====================================================================
# Gestión Documental - Proxy interno (Apache httpd, 192.168.129.111, Rocky Linux 9.5)
#
# Copiar a /etc/httpd/conf.d/gestion-documental.conf, ajustar las rutas del certificado
# comodín (las de los demás sitios de este proxy) y:
#     apachectl configtest && systemctl reload httpd
#
# El usuario ve el certificado *.asuncion.gov.py de este proxy. De aquí al servidor Docker
# la conexión también va cifrada, y el proxy comprueba que del otro lado esté ese servidor:
# copie el certificado de cada uno (/etc/gestion-documental/tls/certificado.crt) a
#     /etc/httpd/gestion-documental/caliope.crt      (producción)
#     /etc/httpd/gestion-documental/caliopedev.crt    (desarrollo)
#
# Solo en el DNS interno: mesa.asuncion.gov.py -> 192.168.129.111 y mesa-dev.asuncion.gov.py -> 192.168.129.111
# Requiere mod_ssl, mod_proxy, mod_proxy_http y mod_headers (vienen con httpd y mod_ssl).
# =====================================================================

# ---- HTTP: todo a HTTPS
<VirtualHost *:80>
    ServerName mesa.asuncion.gov.py
    ServerAlias mesa-dev.asuncion.gov.py
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ---- Producción
<VirtualHost *:443>
    ServerName mesa.asuncion.gov.py

    SSLEngine on
    # AJUSTAR: las mismas rutas que usan los otros sitios *.asuncion.gov.py de este proxy
    SSLCertificateFile    /etc/letsencrypt/live/asuncion.gov.py/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/asuncion.gov.py/privkey.pem

    # Hacia caliope, cifrado y verificado
    SSLProxyEngine on
    SSLProxyVerify require
    SSLProxyCheckPeerName on
    SSLProxyCheckPeerExpire on
    SSLProxyCACertificateFile /etc/httpd/gestion-documental/caliope.crt

    # Conserva el nombre (mesa.asuncion.gov.py): sin esto fallan las redirecciones del inicio de sesión.
    # mod_proxy agrega por su cuenta X-Forwarded-For con la IP del usuario; el nginx de caliope
    # solo le cree a este proxy (192.168.129.111)
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / https://caliope.asuncion.gov.py/ timeout=120
    ProxyPassReverse / https://caliope.asuncion.gov.py/

    # Igual que nginx y la aplicación: PDF de hasta 50 MB por pedido, con margen
    LimitRequestBody 62914560
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  logs/gestion-documental-error.log
    CustomLog logs/gestion-documental-acceso.log combined
</VirtualHost>

# ---- Desarrollo
<VirtualHost *:443>
    ServerName mesa-dev.asuncion.gov.py

    SSLEngine on
    # AJUSTAR: las mismas rutas que arriba
    SSLCertificateFile    /etc/letsencrypt/live/asuncion.gov.py/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/asuncion.gov.py/privkey.pem

    SSLProxyEngine on
    SSLProxyVerify require
    SSLProxyCheckPeerName on
    SSLProxyCheckPeerExpire on
    SSLProxyCACertificateFile /etc/httpd/gestion-documental/caliopedev.crt

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / https://caliopedev.asuncion.gov.py/ timeout=120
    ProxyPassReverse / https://caliopedev.asuncion.gov.py/

    LimitRequestBody 62914560

    ErrorLog  logs/gestion-documental-dev-error.log
    CustomLog logs/gestion-documental-dev-acceso.log combined
</VirtualHost>

# =====================================================================
# Gestión Documental - Proxy interno (persefone, Apache httpd, 192.168.129.111)
#
# Mismo formato que los demás sitios de este proxy. Copiar junto a ellos y:
#     apachectl configtest && systemctl reload httpd
#
# El usuario ve el certificado *.asuncion.gov.py de este proxy. De aquí al servidor Docker
# la conexión también va cifrada y, a diferencia de otros sitios, se VERIFICA el certificado
# del servidor: copie el de cada uno (/etc/gestion-documental/tls/certificado.crt) a
#     /etc/httpd/conf/gestion-documental/caliopedev.crt   (desarrollo)
#     /etc/httpd/conf/gestion-documental/caliope.crt      (producción, el día del corte)
#
# DNS interno (asuncion.gov.py.interno.db):  mesadev  IN CNAME persefone.asuncion.gov.py.
# =====================================================================

# ---------------------------------------------------------------------
# Desarrollo: mesadev.asuncion.gov.py -> caliopedev (192.168.129.83)
# ---------------------------------------------------------------------
<VirtualHost 192.168.129.111:80>
        ServerAdmin webmaster@asuncion.gov.py
        ServerName mesadev.asuncion.gov.py
        RewriteEngine on
        RewriteCond %{HTTP_HOST} ^mesadev.asuncion.gov.py
        RewriteRule ^/(.*)$ https://mesadev.asuncion.gov.py/$1 [L,R=301]
        CustomLog "logs/mesadev.access.log" combined env=!loopback
        ErrorLog "logs/mesadev.error.log"
        IncludeOptional conf/seguridad.conf
</VirtualHost>

<VirtualHost 192.168.129.111:443>
        ServerAdmin webmaster@asuncion.gov.py
        ServerName mesadev.asuncion.gov.py
        CustomLog "logs/mesadev.ssl.access.log" combined env=!loopback
        ErrorLog "logs/mesadev.ssl.error.log"
        LogLevel warn

        SSLEngine on
        SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
        SSLCipherSuite HIGH:!aNULL:!MD5:!SEED:!IDEA
        # El comodín vigente, el mismo que usan los demás sitios
        SSLCertificateFile /home/2026_certi/STAR_asuncion_gov_py.crt
        SSLCertificateKeyFile /home/2026_certi/STAR_asuncion_gov_py.key
        SSLCertificateChainFile /home/2026_certi/STAR_asuncion_gov_py.ca-bundle

        # Hacia caliopedev, cifrado y verificado: el proxy comprueba que del otro lado esté
        # caliopedev y no otro equipo que se haga pasar por él
        SSLProxyEngine on
        SSLProxyVerify require
        SSLProxyCheckPeerName on
        SSLProxyCheckPeerExpire on
        SSLProxyCACertificateFile /etc/httpd/conf/gestion-documental/caliopedev.crt

        # Conserva el nombre (mesadev.asuncion.gov.py): sin esto fallan las redirecciones del
        # inicio de sesión. mod_proxy agrega X-Forwarded-For con la IP del usuario, y el nginx
        # de caliopedev solo le cree a este proxy: la auditoría registra la IP real
        ProxyRequests Off
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        ProxyPass        / https://192.168.129.83/ timeout=120
        ProxyPassReverse / https://192.168.129.83/

        # PDF de hasta 50 MB por pedido, con margen (igual que nginx y la aplicación)
        LimitRequestBody 62914560
</VirtualHost>


# =====================================================================
# Gestión Documental - Máquinas virtuales para Docker (lo lee crear-vm.sh)
#
# Servidor de virtualización: Ubuntu 22.04 (192.168.129.13), qemu-kvm con libvirt.
# Sin contraseñas: la del administrador va en el archivo HASH_ADMIN, fuera del repositorio.
# Complete lo que dice COMPLETAR; el script no arranca mientras quede alguno.
# =====================================================================

# --- Comunes a las dos máquinas
ISO="COMPLETAR"                         # ej. /var/lib/libvirt/images/Rocky-9.6-x86_64-dvd.iso (la DVD, no la minimal ni la boot)
CARPETA_DISCOS="/var/lib/libvirt/images"
PUENTE="br0"
# Red, DNS y dominio: los mismos que atenea y ateneadev (relevados el 12/11/2026)
MASCARA="255.255.255.0"
PUERTA="192.168.129.1"
DNS="192.168.129.111"                   # uno o varios, separados por coma
DOMINIO="asuncion.gov.py"               # el nombre queda <equipo>.asuncion.gov.py
ADMIN="COMPLETAR"                       # usuario administrador dentro de las máquinas (con sudo)
CLAVE_SSH="COMPLETAR"                   # ej. /home/tics/.ssh/id_ed25519.pub (la pública)
HASH_ADMIN="/home/tics/.gd-admin.hash"  # lo crea: openssl passwd -6 > ~/.gd-admin.hash && chmod 600 ~/.gd-admin.hash

# --- Una línea por máquina. El primer campo es el que se pasa a crear-vm.sh

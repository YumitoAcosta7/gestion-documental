# Red, DNS y dominio: los mismos que atenea y ateneadev (relevados el 12/11/2026)
MASCARA="255.255.255.0"
PUERTA="192.168.129.1"
DNS="192.168.129.111"                   # uno o varios, separados por coma
DOMINIO="asuncion.gov.py"               # el nombre queda <equipo>.asuncion.gov.py
ADMIN="root"                            # como los demás servidores. Otro nombre: root bloqueado y ese usuario con sudo
CLAVE_SSH=""                            # opcional: ruta de una clave pública (.pub). Vacía: root entra con contraseña hasta cargar la llave
HASH_ADMIN="/home/tics/.gd-admin.hash"  # contraseña de ADMIN, cifrada. La crea: openssl passwd -6 > ~/.gd-admin.hash && chmod 600 ~/.gd-admin.hash


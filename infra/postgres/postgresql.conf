# =====================================================================
# PostgreSQL 17 de Gestión Documental (contenedor gd-db)
#
# Prioridad: que nada confirmado se pierda ante un corte de energía. Por eso
# fsync, synchronous_commit y full_page_writes quedan encendidos: nunca apagarlos
# para ganar velocidad. La cadena de huellas de las bitácoras depende de que
# cada fila confirmada esté de verdad en el disco.
# =====================================================================

# --- Conexiones: solo desde la red interna de Docker (el puerto no se publica en producción)
listen_addresses = '*'
port = 5432
max_connections = 50
password_encryption = scram-sha-256

# --- Durabilidad
fsync = on
synchronous_commit = on
full_page_writes = on
wal_sync_method = fdatasync
wal_level = replica
wal_log_hints = on
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Para recuperar a un punto en el tiempo (PITR) hace falta archivar el WAL en otro equipo.
# Queda apagado hasta definir ese destino: con el respaldo diario se pierde como máximo un día.
archive_mode = off

# --- Memoria: para un servidor de 8 GB. Ajustar si cambia
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# --- Hora: la misma que la aplicación (guarda la hora local)
timezone = 'America/Asuncion'
log_timezone = 'America/Asuncion'

# --- Registro: a la salida estándar, que Docker envía a journald
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_lock_waits = on
log_checkpoints = on
log_min_duration_statement = 2000
log_statement = 'ddl'

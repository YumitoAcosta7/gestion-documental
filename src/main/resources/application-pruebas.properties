# =====================================================================
# Perfil "pruebas": base y carpeta de PDF separadas de producción.
# Se activa con SPRING_PROFILES_ACTIVE=pruebas (o -Dspring-boot.run.profiles=pruebas).
# Preparación de la base: docs/ambiente-pruebas.md
# =====================================================================

spring.datasource.url=jdbc:postgresql://192.168.129.73:5432/gestion_documental_pruebas
spring.datasource.username=gestion_documental_pruebas
# La contraseña nunca se versiona: variable de entorno DB_PASSWORD_PRUEBAS
spring.datasource.password=${DB_PASSWORD_PRUEBAS:}

# PDFs de prueba en otra carpeta, para no mezclarlos con los reales
app.upload.dir=C:/gestion-documental-uploads-pruebas/acuses

# Serie de CUTI propia: un expediente de prueba nunca se confunde con uno real
app.cuti.prefijo=PRU

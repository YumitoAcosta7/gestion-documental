<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Gestión Documental</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/institucional.css}">
</head>
<body class="acceso d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card border shadow-sm p-4" style="width: 100%; max-width: 440px; border-radius: 8px;">
        <div class="text-center mb-3">
            <img th:replace="~{fragments/marca :: escudo}">
            <h1 class="h4 fw-semibold mb-1">Cambiar contraseña</h1>
            <p class="text-muted small mb-0" th:text="${usuario.nombreCompleto + ' (' + usuario.username + ')'}">Usuario</p>
        </div>

        <div th:if="${usuario.debeCambiarContrasena}" class="alert alert-warning small py-2">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            Está usando una contraseña temporal. Defina la suya para continuar.
        </div>
        <div th:if="${error}" class="alert alert-danger small py-2" th:text="${error}">Error</div>

        <form th:action="@{/cuenta/contrasena}" method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label small fw-bold" for="actual">Contraseña actual</label>
                <input type="password" class="form-control" id="actual" name="actual" required autofocus autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold" for="nueva">Contraseña nueva</label>
                <input type="password" class="form-control" id="nueva" name="nueva" required minlength="10" autocomplete="new-password">
                <div class="form-text" th:text="${'Debe tener ' + reglas + '.'}">Reglas</div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold" for="repetida">Repita la contraseña nueva</label>
                <input type="password" class="form-control" id="repetida" name="repetida" required minlength="10" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                <i class="bi bi-check-lg me-1"></i> Guardar contraseña
            </button>
        </form>

        <div class="d-flex justify-content-between mt-3 small">
            <a th:unless="${usuario.debeCambiarContrasena}" th:href="@{/}" class="text-decoration-none">← Volver</a>
            <form th:action="@{/logout}" method="post" class="m-0 ms-auto">
                <button type="submit" class="btn btn-link btn-sm p-0 text-danger text-decoration-none">Cerrar sesión</button>
            </form>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Gestión Documental TIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg p-4" style="width: 100%; max-width: 420px; border-radius: 12px;">
        <div class="text-center mb-4">
            <i class="bi bi-journal-bookmark-fill text-primary display-4"></i>
            <h4 class="fw-bold mt-2">Mesa de Entrada TIC</h4>
            <p class="text-muted small">Municipalidad de Asunción</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger small py-2">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-info small py-2">
            <i class="bi bi-info-circle-fill me-1"></i> Sesión cerrada exitosamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario / Legajo</label>
                <input type="text" class="form-control" name="username" placeholder="Ej: director_tic" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>
    </div>

</body>
</html>

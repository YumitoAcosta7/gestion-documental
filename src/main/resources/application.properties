spring.application.name=gestion-documental

# Archivo local opcional con credenciales (no versionado)
spring.config.import=optional:file:./application-local.properties

# Dirección de la Base de Datos 
spring.datasource.url=jdbc:postgresql://192.168.129.73:5432/gestion_documental

# Credenciales de PostgreSQL (la contraseña se toma de DB_PASSWORD o de ./application-local.properties)
spring.datasource.username=gestion_documental
spring.datasource.password=${DB_PASSWORD:}

# Driver oficial de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

###### CONFIGURACIÓN DE JPA / HIBERNATE

# Mantiene intacta la estructura SQL que ya creamos (no la modifica ni la borra)
spring.jpa.hibernate.ddl-auto=validate

# Consultas SQL en la consola: desactivado (activar solo para depurar en desarrollo)
spring.jpa.show-sql=false


# Directorio donde se guardarán los PDFs de acuses escaneados
app.upload.dir=C:/gestion-documental-uploads/acuses
# Permite cargar relaciones LAZY al renderizar las vistas Thymeleaf (valor por defecto, explícito para evitar el aviso)
spring.jpa.open-in-view=true

###### ARCHIVOS ADJUNTOS
# Límite técnico de recepción (Tomcat). Es mayor que el de la aplicación a propósito: así un PDF
# de 20 a 50 MB llega al servicio y el usuario recibe el mensaje claro de app.upload.max-pdf-size
# en lugar de un error 413 del servidor.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
# Tomcat sigue leyendo el cuerpo rechazado para poder responder con el mensaje (sin cortar la conexión)
server.tomcat.max-swallow-size=100MB
# Tamaño máximo aceptado por la aplicación para cada PDF (validado también por su contenido)
app.upload.max-pdf-size=20MB

###### ALERTAS DE DEMORA (días hábiles sin movimiento)
app.sla.dias-advertencia=5
app.sla.dias-critico=10
# Expedientes URGENTES
app.sla.urgente.dias-advertencia=2
app.sla.urgente.dias-critico=4
# Reportes: plazo para producir un informe, en días hábiles (RI 2653/12)
app.reportes.dias-informe=8


###### MIGRACIONES (Flyway)
# Aplica al arrancar los scripts de db/migraciones que falten. La base existente se toma como
# línea base en V6 (V2 a V6 se aplicaron a mano antes de adoptar Flyway); desde V7 los aplica Flyway.
spring.flyway.locations=classpath:db/migraciones
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6
spring.flyway.baseline-description=Esquema previo a Flyway (V2 a V6 aplicadas a mano)

###### SESIONES E INICIO DE SESIÓN (auditoría A2)
# La sesión vence tras 30 minutos sin actividad
server.servlet.session.timeout=30m
# Cookie de sesión (auditoría B3): inaccesible desde JavaScript y no enviada en peticiones de otros sitios.
# Con HTTPS, definir APP_COOKIE_SEGURA=true para que el navegador solo la envíe cifrada.
# Si un proxy inverso termina el HTTPS, agregar además server.forward-headers-strategy=native.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SEGURA:false}
# Intentos fallidos seguidos antes de bloquear el usuario, y minutos de bloqueo
app.login.intentos-maximos=5
app.login.minutos-bloqueo=15
# Fallos desde una misma dirección IP (con cualquier usuario) dentro de esos minutos antes de bloquearla.
# Alto a propósito: varias oficinas pueden salir por la misma dirección.
app.login.intentos-maximos-ip=20

###### CANAL DE DERIVACIÓN (auditoría M2)
# Solo se deriva a dependencias con alguien que pueda recibir el pase (un usuario activo o una
# asignación vigente). En false se permite derivar a áreas que todavía no usan el sistema: el pase
# queda pendiente hasta que alguien de esa área lo confirme.
app.canal.exigir-receptor=true
